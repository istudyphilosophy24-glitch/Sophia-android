name: Build SOPHIA 9 Definitive Academy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Retrieve historical Project Gutenberg editions from SOPHIA 5 archive
        uses: actions/download-artifact@v4
        with:
          name: SOPHIA-5-Native-APK
          run-id: 38704379111
          github-token: ${{ github.token }}
          path: sophia5_sources
      - name: Assemble indexed definitive audio library
        shell: bash
        run: |
          SOURCE_APK="$(find sophia5_sources -type f -name '*.apk' | head -n 1)"
          test -s "$SOURCE_APK"
          python3 tools/build_audio9.py "$SOURCE_APK"
      - name: Validate curriculum and excerpt library
        run: python3 tools/validate_content.py && python3 tools/validate_eight.py && python3 tools/validate_nine.py
      - name: Compile native APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SOPHIA-9-Definitive-Academy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
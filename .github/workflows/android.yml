name: Build SOPHIA 5 Native
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle full public-domain primary works
        shell: bash
        run: |
          mkdir -p app/src/main/assets/primary
          good=0
          for id in 1656 1497 8438 59 9662 4280 4363 11224 5827 3330 216 2017 2680; do
            file="app/src/main/assets/primary/$id.txt"
            echo "Fetching Gutenberg edition $id"
            if curl --fail -L -sS --retry 2 --connect-timeout 15 --max-time 100 \
               -A "SOPHIA/5.0 (non-commercial public domain reading app)" \
               "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" -o "$file"; then
              if grep -qi "Project Gutenberg" "$file"; then good=$((good+1)); else rm -f "$file"; fi
            else
              rm -f "$file"
            fi
          done
          echo "Complete verified works bundled: $good"
          if [ "$good" -lt 5 ]; then echo "Primary text download insufficient" >&2; exit 1; fi
      - name: Compile native APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SOPHIA-5-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
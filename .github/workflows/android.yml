name: Build SOPHIA 9 Definitive Academy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate definitive content and audio library
        run: python3 tools/validate_content.py && python3 tools/validate_eight.py && python3 tools/validate_nine.py
      - name: Compile native APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publish sideloadable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SOPHIA-9-Definitive-Academy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error